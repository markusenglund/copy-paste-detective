---
- name: Initial server setup
  hosts: server
  become: true
  vars:
    volume_device: /dev/sdb
    mount_point: /mnt/storage
    app_dir: /opt/copy-paste-detective

  tasks:
    - name: Install prerequisites
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Format storage volume (skips if already formatted)
      filesystem:
        fstype: ext4
        dev: "{{ volume_device }}"

    - name: Create mount point
      file:
        path: "{{ mount_point }}"
        state: directory

    - name: Mount storage volume
      mount:
        path: "{{ mount_point }}"
        src: "{{ volume_device }}"
        fstype: ext4
        state: mounted

    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory
